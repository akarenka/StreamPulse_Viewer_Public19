plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.akarenka.streamingpulse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.akarenka.streamingpulse'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'STREAM_URL', '"https://streamingpulse.netlify.app/"'
        buildConfigField 'String', 'VERIFY_URL', '"https://REPLACE_WITH_CLOUD_FUNCTION_URL/verifyPlaySubscription"'
    }

    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
